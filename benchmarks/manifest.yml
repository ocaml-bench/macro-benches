# manifest.yml — the programs this tree can build and run.
#
# Why this file exists: a build script alone is not enough to build a benchmark.
# Several scripts derive their dune target from the *output filename* (e.g.
# ahrefs-devkit.build.sh switches on devkit_stre / devkit_gzip / …), so
# "run every benchmarks/*/*.build.sh" does not work — you need the program list.
# Until now that list lived only in running-ng's macro_base.yml, which meant this
# repo could not check itself. scripts/ci-build-all.sh and scripts/ci-run-all.sh
# read this file, and CI runs both on every push to master.
#
# `args` are copied VERBATIM from running-ng's `macro_base.yml` so the two can be
# diffed mechanically. Programs are run from a scratch working directory, so
# relative outputs in the args (menhir's `--base sql-parser`, goblint's
# `witness.yml`) land there instead of in the source tree.
#
# ${RUNNING_MACRO_BENCH_DIR} expands to the root of this repo.
#
# Adding a benchmark: add its entry here in the same commit as its build script,
# and add the matching program to running-ng's macro_base.yml. CI fails if a
# program listed here has no build script, or if a build script has no program.
#
# Knob-A ladder rungs (*_small / *_default / *_large / *_huge) are deliberately
# NOT listed: they are the same binary at a larger input, so the base rung is the
# signal CI needs, and the big rungs do not fit a hosted runner (sedlex's large
# rung alone peaks near 27 GB RSS). When the rungs land, list only the small one.

default_timeout: 600

programs:
  # --- menhir ---------------------------------------------------------------
  menhir_ocamly:
    tool: menhir
    build_script: menhir.build.sh
    args: "${RUNNING_MACRO_BENCH_DIR}/benchmarks/menhir/ocaml.mly --list-errors --no-stdlib --canonical"
  menhir_sql_parser:
    tool: menhir
    build_script: menhir.build.sh
    args: "-v -t ${RUNNING_MACRO_BENCH_DIR}/benchmarks/menhir/keywords.mly ${RUNNING_MACRO_BENCH_DIR}/benchmarks/menhir/sql-parser.mly --base sql-parser"
  menhir_sysver:
    tool: menhir
    build_script: menhir.build.sh
    # The one place these args deviate from running-ng's: without --base, menhir
    # derives the output base from the input path and rewrites the *committed*
    # sysver.{ml,mli,automaton,conflicts} in the source tree — a ~110 MB diff whose
    # only content is the absolute path in the `# line` directives. --base moves the
    # output to the scratch cwd; the table construction being measured is identical.
    args: "-v --table ${RUNNING_MACRO_BENCH_DIR}/benchmarks/menhir/sysver.mly --base ${SCRATCH}/sysver"

  # --- cpdf -----------------------------------------------------------------
  cpdf_merge:
    tool: cpdf
    build_script: cpdf.build.sh
    args: "-merge ${RUNNING_MACRO_BENCH_DIR}/benchmarks/cpdf/PDFReference16.pdf_toobig ${RUNNING_MACRO_BENCH_DIR}/benchmarks/cpdf/PDFReference16.pdf_toobig -o /dev/null"
  cpdf_blacktext:
    tool: cpdf
    build_script: cpdf.build.sh
    args: "-blacktext ${RUNNING_MACRO_BENCH_DIR}/benchmarks/cpdf/PDFReference16.pdf_toobig -o /dev/null"
  cpdf_scale:
    tool: cpdf
    build_script: cpdf.build.sh
    args: "scale-to-fit a4landscape -twoup ${RUNNING_MACRO_BENCH_DIR}/benchmarks/cpdf/PDFReference16.pdf_toobig -o /dev/null"
  cpdf_squeeze:
    tool: cpdf
    build_script: cpdf.build.sh
    args: "-squeeze ${RUNNING_MACRO_BENCH_DIR}/benchmarks/cpdf/PDFReference16.pdf_toobig -o /dev/null"

  # --- alt-ergo -------------------------------------------------------------
  alt_ergo_fill:
    tool: alt-ergo
    build_script: alt-ergo.build.sh
    args: "--input native ${RUNNING_MACRO_BENCH_DIR}/benchmarks/alt-ergo/fill_x100.why"
    # fill_x100.why is generated by alt-ergo.build.sh (100 copies of fill.why) and
    # gitignored, so it does not exist on a fresh checkout when `check` runs.
    inputs_generated: true
  alt_ergo_yyll:
    tool: alt-ergo
    build_script: alt-ergo.build.sh
    args: "--input native ${RUNNING_MACRO_BENCH_DIR}/benchmarks/alt-ergo/yyll.why"
  alt_ergo_unsat_smt2:
    tool: alt-ergo
    build_script: alt-ergo.build.sh
    args: "--timelimit 15 ${RUNNING_MACRO_BENCH_DIR}/benchmarks/alt-ergo/unsat.smt2"
    # The workload IS "solve for 15 seconds": --timelimit arms SIGVTALRM, the goal
    # never closes, alt-ergo prints `unknown / (error "timeout")` and the process
    # dies of the signal — 128+14 = 142, every run, by design.
    expected_exit: 142

  # --- frama-c --------------------------------------------------------------
  frama_c_eva_t:
    tool: frama-c
    build_script: frama-c.build.sh
    args: "t"
  frama_c_eva_sqlite:
    tool: frama-c
    build_script: frama-c.build.sh
    args: "sqlite"

  # --- goblint --------------------------------------------------------------
  goblint:
    tool: goblint
    build_script: goblint.build.sh
    args: ""

  # --- coq / rocq -----------------------------------------------------------
  coqc_corelib_stress:
    tool: coq
    build_script: coq.build.sh
    args: "${RUNNING_MACRO_BENCH_DIR}/benchmarks/coq/coq_corelib_stress.v"

  # --- ahrefs devkit --------------------------------------------------------
  devkit_htmlstream:
    tool: ahrefs-devkit
    build_script: ahrefs-devkit.build.sh
    args: ""
  devkit_stre:
    tool: ahrefs-devkit
    build_script: ahrefs-devkit.build.sh
    args: "30"
  devkit_network:
    tool: ahrefs-devkit
    build_script: ahrefs-devkit.build.sh
    args: "4"
  devkit_gzip:
    tool: ahrefs-devkit
    build_script: ahrefs-devkit.build.sh
    args: "5"

  # --- the rest (one program each) -----------------------------------------
  irmin_mem_rw:
    tool: irmin
    build_script: irmin.build.sh
    args: "3000 10000 80 20000"
  ocamlformat_rocq:
    tool: ocamlformat
    build_script: ocamlformat.build.sh
    args: "--impl ${RUNNING_MACRO_BENCH_DIR}/benchmarks/ocamlformat/workload_5x.ml -o /dev/null"
  test_decompress:
    tool: decompress
    build_script: decompress.build.sh
    args: "64 524288"
  eio_fiber_stream:
    tool: eio
    build_script: eio.build.sh
    args: ""
  sedlex_tokenize:
    tool: sedlex
    build_script: sedlex.build.sh
    args: "700000"
  ydump_repeat:
    tool: yojson
    build_script: yojson.build.sh
    args: "1000 ${RUNNING_MACRO_BENCH_DIR}/benchmarks/yojson/sample.json"
  zarith_pi:
    tool: zarith
    build_script: zarith.build.sh
    args: "15000"
  owl_gc:
    tool: owl
    build_script: owl.build.sh
    args: "6"
  ocamlc_self_compile:
    tool: ocamlc-self-compile
    build_script: ocamlc-self-compile.build.sh
    args: ""
  liq_parse_typecheck:
    tool: liquidsoap-lang
    build_script: liquidsoap-lang.build.sh
    args: "50000"
  jsoo:
    tool: js_of_ocaml
    build_script: jsoo.build.sh
    args: ""
  liq_video_frames_pool:
    tool: liq-video-frames
    build_script: liq-video-frames.build.sh
    args: "30000"
  pplacer_testsuite:
    tool: pplacer
    build_script: pplacer.build.sh
    args: "5"

# Tools that ship in the tree but are not built or run. Listed so CI's
# "every build script has a program" check knows they are deliberate.
disabled:
  lavyek:
    build_script: lavyek.build.sh
    reason: "source lives in a private repo (tarides/lavyek); never cloned by setup-monorepo.sh"
  merlin:
    build_script: merlin.build.sh
    reason: "upstream race in the domains typer — see benchmarks/merlin/UPSTREAM_BUG.md"
