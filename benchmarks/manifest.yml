# manifest.yml — the programs this tree can build and run.
#
# Why this file exists: a build script alone is not enough to build a benchmark.
# Several scripts derive their dune target from the *output filename* (e.g.
# ahrefs-devkit.build.sh switches on devkit_stre / devkit_gzip / …), so
# "run every benchmarks/*/*.build.sh" does not work — you need the program list.
# Until now that list lived only in running-ng's macro_base.yml, which meant this
# repo could not check itself. scripts/ci-build-all.sh and scripts/ci-run-all.sh
# read this file, and CI runs both on every push to master.
#
# `args` are copied VERBATIM from running-ng's `macro_base.yml` so the two can be
# diffed mechanically. Programs are run from a scratch working directory, so
# relative outputs in the args (menhir's `--base sql-parser`, goblint's
# `witness.yml`) land there instead of in the source tree.
#
# ${RUNNING_MACRO_BENCH_DIR} expands to the root of this repo.
#
# Adding a benchmark: add its entry here in the same commit as its build script,
# and add the matching program to running-ng's macro_base.yml. CI fails if a
# program listed here has no build script, or if a build script has no program.
#
#
#
# Input-size ladder: every rung (*_small/_default/_large[/_huge]) is listed so
# ci-build-all.sh builds them all (catching build breaks). CI *runs* only the
# rungs flagged `ci_run: true` (the small rung of each tool) — the big rungs
# don't fit a hosted runner (sedlex's large peaks ~27 GB RSS). The pre-ladder
# and frozen-reproducer benchmarks are listed too (built, not run in CI).

default_timeout: 600

