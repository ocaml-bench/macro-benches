name: CI

# PRs into master gate the merge; pushes to master verify the result after it
# (required checks are not `strict`, so two green PRs can still break master
# together) and refresh the cache in master's scope, which every PR can restore
# from. Nothing runs on other branch pushes.
on:
  pull_request:
    branches: [master]
  push:
    branches: [master]
  workflow_dispatch:
  schedule:
    # Weekly cold run without cache: checks that every pinned commit and tarball
    # is still fetchable and the rocq bootstrap runs from nothing.
    - cron: "0 4 * * 1"

concurrency:
  group: ci-${{ github.ref }}
  # Cancel superseded PR runs only: a cancelled master run would leave a merge
  # unverified.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build-and-run:
    name: build + run once (${{ matrix.label }})
    runs-on: ubuntu-latest
    timeout-minutes: 240
    # Only the stable leg is a required check. The trunk and oxcaml legs track
    # moving compilers, so they can go red for unrelated reasons; they fail the
    # run (so breakage is visible) without blocking merges.
    strategy:
      fail-fast: false
      matrix:
        include:
          # `label` is the check name branch protection requires; keep version
          # numbers out of it.
          - label: "stable"
            ocaml: "5.5.0"
            # Released dune >= 3.24 breaks the vendored rocq build.
            dune: "3.22.1"
          - label: "trunk"
            ocaml: "ocaml-variants.5.6.0+trunk"
            # Released dune can't bootstrap against 5.6 trunk; use git main.
            dune: "dev"
          - label: "oxcaml"
            # setup-ocaml's switch only provides opam; the runtime is the
            # `oxcaml` switch built below from oxcaml/oxcaml main.
            ocaml: "5.4.1"
            oxcaml: true
            # OxCaml switches need dune's +ox build.
            dune: "3.22.2+ox"

    env:
      # Picks the build dir (_build-ci) and the output binary suffix.
      RUNNING_OCAML_RUNTIME_NAME: ci

    steps:
      - uses: actions/checkout@v4

      # Resolve the trunk tip before creating the switch and fold it into every
      # cache key, or a restored opam-root cache would hand back a stale switch.
      - name: Resolve compiler identity
        id: compiler
        run: |
          if [ "${{ matrix.oxcaml }}" = "true" ]; then
            api() { curl -fsSL "https://api.github.com/repos/oxcaml/$1"; }
            sha="$(api oxcaml/commits/main | python3 -c 'import json,sys; print(json.load(sys.stdin)["sha"])')"
            repo="$(api opam-repository/commits/main | python3 -c 'import json,sys; print(json.load(sys.stdin)["sha"])')"
            # OxCaml has no in-tree compiler opam file: borrow the newest recipe.
            recipe="$(api "opam-repository/contents/packages/oxcaml-compiler?ref=${repo}" \
                      | python3 -c 'import json,sys; [print(e["name"]) for e in json.load(sys.stdin)]' | sort -V | tail -1)"
            { echo "id=oxcaml-${sha:0:12}-${repo:0:12}"; echo "sha=${sha}"; echo "repo=${repo}"; echo "recipe=${recipe}"; } >> "$GITHUB_OUTPUT"
            echo "### Compiler: oxcaml/oxcaml main @ \`${sha:0:12}\` (recipe \`${recipe}\`, opam-repository \`${repo:0:12}\`)" >> "$GITHUB_STEP_SUMMARY"
          elif [[ "${{ matrix.ocaml }}" == *trunk* ]]; then
            sha="$(curl -fsSL https://api.github.com/repos/ocaml/ocaml/commits/trunk \
                   | python3 -c 'import json,sys; print(json.load(sys.stdin)["sha"][:12])')"
            echo "id=trunk-${sha}" >> "$GITHUB_OUTPUT"
            echo "### Compiler: ocaml/ocaml trunk @ \`${sha}\`" >> "$GITHUB_STEP_SUMMARY"
          else
            echo "id=${{ matrix.ocaml }}" >> "$GITHUB_OUTPUT"
            echo "### Compiler: OCaml ${{ matrix.ocaml }}" >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Install system dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends \
            build-essential autoconf automake m4 pkg-config \
            libgmp-dev libmpfr-dev libevent-dev libcurl4-openssl-dev \
            libpcre3-dev zlib1g-dev libopenblas-dev liblapacke-dev \
            libgsl-dev libsqlite3-dev libyaml-dev python3-yaml

      - uses: ocaml/setup-ocaml@v3
        with:
          ocaml-compiler: ${{ matrix.ocaml }}
          cache-prefix: ${{ steps.compiler.outputs.id }}

      # Restored with the opam root on a cache hit. The recipe is pinned to the
      # commit, so this builds main, not the recipe's release.
      - name: Create the OxCaml switch
        if: matrix.oxcaml
        run: |
          if ! opam switch list --short | grep -qx oxcaml; then
            opam switch create oxcaml --empty --no-switch \
              --repositories="oxcaml=git+https://github.com/oxcaml/opam-repository#${{ steps.compiler.outputs.repo }},default"
            opam pin add --switch oxcaml --yes --no-action ${{ steps.compiler.outputs.recipe }} \
              "git+https://github.com/oxcaml/oxcaml#${{ steps.compiler.outputs.sha }}"
            v="${{ steps.compiler.outputs.recipe }}"; v="${v#oxcaml-compiler.}"
            opam install --switch oxcaml --yes "ocaml-variants.${v%%-*}+ox"
          fi
          opam switch set oxcaml
          opam exec -- ocamlopt -version

      # The only place the GNU half of test-lib-portable.sh can run (FreeBSD
      # skips those comparisons). test-build-scripts-portable.sh is static, so it
      # catches a missing lib-portable.sh source that only breaks on FreeBSD.
      - name: Portability helpers and build-script wiring
        run: |
          bash scripts/tests/test-lib-portable.sh
          bash scripts/tests/test-build-scripts-portable.sh

      # Checks the FreeBSD workflow's package names against FreeBSD's index over
      # HTTP; skips rather than fails if the index cannot be fetched.
      - name: FreeBSD package names resolve
        run: python3 scripts/tests/check-freebsd-packages.py

      # Fails in seconds on a benchmark added without a manifest entry, rather
      # than 40 minutes into a build.
      - name: Validate the manifest against the tree
        run: python3 scripts/ci-manifest.py check

      - name: Install dune (${{ matrix.dune }})
        run: |
          eval "$(opam env)"
          if [ "${{ matrix.dune }}" = "dev" ]; then
            opam pin add --yes dune --dev-repo
          else
            opam pin add --yes --no-action dune ${{ matrix.dune }}
            opam install --yes dune.${{ matrix.dune }}
          fi
          dune --version
          # goblint's apron and infer's javalib/sawja build with the runtime's
          # ocamlfind; setup's own tools live in its own switch.
          opam install --yes ocamlfind

      # duniverse/, vendor/ and _rocq_prefix/ are the setup phase's output;
      # vendor/ also holds the per-runtime apron prefix, so the compiler identity
      # is part of the key.
      - name: Cache vendored sources
        if: github.event_name != 'schedule'
        uses: actions/cache@v4
        with:
          path: |
            duniverse
            vendor
            _rocq_prefix
          key: vendor-${{ steps.compiler.outputs.id }}-${{ hashFiles('macro-benches.opam.locked', 'sources.yml', 'dune-project', 'scripts/setup-monorepo.sh', 'scripts/vendor-*.sh', 'scripts/lib-sources.sh', 'scripts/lib-switch.sh', 'scripts/ppx-expand.sh', 'scripts/ppx-expand/**') }}

      - name: Set up the monorepo (vendor sources, patch, bootstrap rocq)
        run: |
          # setup-monorepo.sh creates and uses its own pinned tools switch
          # (scripts/lib-switch.sh); the switch setup-ocaml made is the runtime
          # under test. SKIP_TEST_BUILD avoids compiling the duniverse a second
          # time into the default _build/ — ci-build-all.sh does that work in
          # _build-ci/ immediately below.
          eval "$(opam env)"
          SKIP_TEST_BUILD=1 bash scripts/setup-monorepo.sh

      - name: Build every benchmark
        run: |
          eval "$(opam env)"
          bash scripts/ci-build-all.sh

      - name: Run every benchmark once
        run: |
          eval "$(opam env)"
          bash scripts/ci-run-all.sh

      - name: Disk and cache usage
        if: always()
        run: |
          df -h /
          du -sh duniverse vendor _rocq_prefix _build-ci 2>/dev/null || true

      - name: Upload logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ci-logs-${{ steps.compiler.outputs.id }}
          path: ci-logs/
          retention-days: 14
          if-no-files-found: ignore
