comparisons:
- a: ocaml-trunk-e53a0322
  b: ocaml-gc-pacing-72c712d4
  label: "gc-pacing PR vs trunk merge-base \u2014 off-heap (M, o) sweep 2026-07-13"
compress_logs: false
config_sweep:
  M:
  - 11
  - 22
  - 44
  - 100
  - 250
  o:
  - 40
  - 80
  - 120
  - 150
  - 200
configs:
- ocaml-trunk-e53a0322|perf_grp1|re-25|md-2|re_par-22|md_par-8|pin_lavyek
- ocaml-gc-pacing-72c712d4|perf_grp1|re-25|md-2|re_par-22|md_par-8|pin_lavyek
heap_range: 6
invocations: 5
minheap_multiplier: 1.0
modifiers:
  M:
    type: OCamlRunParam
    val: M={0}
  gc_verbose:
    type: OCamlRunParam
    val: v=0x400
  md:
    excludes: &id002
      macro-lavyek-monorepo:
      - lavyek_kv_1d
      - lavyek_kv_2d
      - lavyek_kv_4d
      - lavyek_kv_8d
    type: OCamlRunParam
    val: d={0}
  md_par:
    excludes: &id001
      macro-alt-ergo-monorepo:
      - alt_ergo_fill
      - alt_ergo_yyll
      - alt_ergo_unsat_smt2
      macro-coq-monorepo:
      - coqc_corelib_stress
      macro-cpdf-monorepo:
      - cpdf_merge
      - cpdf_blacktext
      - cpdf_scale
      - cpdf_squeeze
      macro-decompress:
      - test_decompress
      macro-devkit:
      - devkit_htmlstream
      - devkit_stre
      - devkit_network
      - devkit_gzip
      macro-eio:
      - eio_fiber_stream
      macro-irmin:
      - irmin_mem_rw
      macro-jsoo:
      - jsoo
      macro-liq-video-frames:
      - liq_video_frames_pool
      macro-liquidsoap-lang:
      - liq_parse_typecheck
      macro-menhir-monorepo:
      - menhir_ocamly
      - menhir_sql_parser
      - menhir_sysver
      macro-merlin:
      - merlin_bench
      macro-ocamlc-self-compile:
      - ocamlc_self_compile
      macro-ocamlformat:
      - ocamlformat_rocq
      macro-owl:
      - owl_gc
      macro-pplacer:
      - pplacer_testsuite
      macro-sedlex:
      - sedlex_tokenize
      macro-yojson:
      - ydump_repeat
      macro-zarith:
      - zarith_pi
    type: OCamlRunParam
    val: d={0}
  o:
    type: OCamlRunParam
    val: o={0}
  perf_grp1:
    type: PerfAndOllyAttach
    val: task-clock,page-faults,cycles,instructions
  perf_grp2:
    type: PerfAndOllyAttach
    val: task-clock,cycles,stalled-cycles-frontend,stalled-cycles-backend
  perf_grp3:
    type: PerfAndOllyAttach
    val: task-clock,cycles,cache-misses,LLC-load-misses,dTLB-load-misses,iTLB-load-misses
  pin_lavyek:
    excludes: *id001
    type: Wrapper
    val: taskset -c 0-15
  re:
    excludes: *id002
    type: OCamlRunParam
    val: e={0}
  re_par:
    excludes: *id001
    type: OCamlRunParam
    val: e={0}
  time_stats:
    type: Wrapper
    val: /usr/bin/time -f "%Uuser %Ssystem %eelapsed %PCPU (%Xavgtext+%Davgdata %Mmaxresident)k"
plugins:
  zulip:
    request:
      to:
      - 361443
      type: private
    type: Zulip
remote_host: null
runtimes:
