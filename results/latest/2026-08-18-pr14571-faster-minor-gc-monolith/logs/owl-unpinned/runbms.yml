      - goblint_gen_default
      - goblint_gen_large
      macro-irmin:
      - irmin_mem_rw
      - irmin_mem_rw_small
      - irmin_mem_rw_default
      - irmin_mem_rw_large
      macro-jsoo:
      - jsoo
      - jsoo_small
      - jsoo_default
      - jsoo_large
