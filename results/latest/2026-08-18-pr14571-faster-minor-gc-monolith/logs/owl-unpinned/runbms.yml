benchmarks:
  macro-alt-ergo-monorepo: []
  macro-coq-monorepo: []
  macro-cpdf-monorepo: []
  macro-decompress: []
  macro-devkit: []
  macro-eio: []
  macro-frama-c-monorepo: []
  macro-goblint-monorepo: []
  macro-irmin: []
  macro-jsoo: []
  macro-lavyek-monorepo: []
  macro-liq-video-frames: []
  macro-liquidsoap-lang: []
  macro-menhir-monorepo: []
  macro-merlin: []
  macro-ocamlc-self-compile: []
  macro-ocamlformat: []
  macro-owl:
  - owl_gc_default
  macro-pplacer: []
  macro-sedlex: []
  macro-yojson: []
  macro-zarith: []
comparisons:
- a: ocaml-trunk-3b14dfbc
  b:
  - ocaml-pr14571
  label: faster minor GC PR vs trunk merge-base (owl_gc_default)
compress_logs: false
config_sweep:
  M:
  - 11
  - 22
  - 44
  - 88
  - 176
  s:
  - 131072
  - 262144
  - 524288
  - 1048576
  - 2097152
configs:
- ocaml-trunk-3b14dfbc|perf_grp1
- ocaml-pr14571|perf_grp1
- ocaml-trunk-3b14dfbc|perf_grp1|malloc_mmap32m|malloc_trim64m
- ocaml-pr14571|perf_grp1|malloc_mmap32m|malloc_trim64m
heap_range: 6
invocations: 5
minheap_multiplier: 1.0
modifiers:
  M:
    type: OCamlRunParam
    val: M={0}
  gc_verbose:
    type: OCamlRunParam
    val: v=0x400
  malloc_mmap32m:
    type: EnvVar
    val: '33554432'
    var: MALLOC_MMAP_THRESHOLD_
  malloc_trim64m:
    type: EnvVar
    val: '67108864'
    var: MALLOC_TRIM_THRESHOLD_
  md:
    excludes: &id002
      macro-lavyek-monorepo:
      - lavyek_kv_1d
      - lavyek_kv_2d
      - lavyek_kv_4d
      - lavyek_kv_8d
    type: OCamlRunParam
    val: d={0}
  md_par:
    excludes: &id001
      macro-alt-ergo-monorepo:
      - alt_ergo_fill
      - alt_ergo_yyll
      - alt_ergo_unsat_smt2
      macro-coq-monorepo:
      - coqc_corelib_stress
      macro-cpdf-monorepo:
      - cpdf_merge
      - cpdf_blacktext
      - cpdf_scale
      - cpdf_squeeze
      macro-decompress:
      - test_decompress
      macro-devkit:
      - devkit_htmlstream
      - devkit_stre
      - devkit_network
      - devkit_gzip
      macro-eio:
      - eio_fiber_stream
      macro-irmin:
      - irmin_mem_rw
      macro-jsoo:
      - jsoo
      macro-liq-video-frames:
      - liq_video_frames_pool
      macro-liquidsoap-lang:
      - liq_parse_typecheck
      macro-menhir-monorepo:
      - menhir_ocamly
      - menhir_sql_parser
      - menhir_sysver
      macro-merlin:
      - merlin_bench
      macro-ocamlc-self-compile:
      - ocamlc_self_compile
      macro-ocamlformat:
      - ocamlformat_rocq
      macro-owl:
      - owl_gc
      macro-pplacer:
      - pplacer_testsuite
      macro-sedlex:
      - sedlex_tokenize
      macro-yojson:
      - ydump_repeat
      macro-zarith:
      - zarith_pi
    type: OCamlRunParam
    val: d={0}
  memtrace_grp1:
    excludes:
      macro-alt-ergo-monorepo:
      - alt_ergo_fill
      - alt_ergo_yyll
      - alt_ergo_unsat_smt2
      macro-coq-monorepo:
      - coqc_corelib_stress
      macro-cpdf-monorepo:
      - cpdf_merge
      - cpdf_blacktext
      - cpdf_scale
      - cpdf_squeeze
      macro-devkit:
      - devkit_htmlstream
      - devkit_stre
      - devkit_network
      - devkit_gzip
      macro-eio:
      - eio_fiber_stream
      macro-frama-c-monorepo:
      - frama_c_eva_t
      - frama_c_eva_sqlite
      macro-goblint-monorepo:
      - goblint
      macro-irmin:
      - irmin_mem_rw
      macro-jsoo:
      - jsoo
      macro-lavyek-monorepo:
      - lavyek_kv_1d
      - lavyek_kv_2d
      - lavyek_kv_4d
      - lavyek_kv_8d
      macro-liq-video-frames:
      - liq_video_frames_pool
      macro-liquidsoap-lang:
      - liq_parse_typecheck
      macro-menhir-monorepo:
      - menhir_ocamly
      - menhir_sql_parser
      - menhir_sysver
      macro-merlin:
      - merlin_bench
      macro-ocamlc-self-compile:
      - ocamlc_self_compile
      macro-ocamlformat:
      - ocamlformat_rocq
      macro-owl:
      - owl_gc
      macro-pplacer:
      - pplacer_testsuite
      macro-sedlex:
      - sedlex_tokenize
      macro-yojson:
      - ydump_repeat
      macro-zarith:
      - zarith_pi
    type: MemtraceAttach
  perf_grp1:
    type: PerfAndOllyAttach
    val: task-clock,page-faults,cycles,instructions
  perf_grp2:
    type: PerfAndOllyAttach
    val: task-clock,cycles,stalled-cycles-frontend,stalled-cycles-backend
  perf_grp3:
    type: PerfAndOllyAttach
    val: task-clock,cycles,cache-misses,LLC-load-misses,dTLB-load-misses,iTLB-load-misses
  pin_lavyek:
    excludes: *id001
    type: Wrapper
    val: taskset -c 0-15
  plan:
    type: EnvVar
    val: '{0}'
    var: MMTK_PLAN
  re:
    excludes: *id002
    type: OCamlRunParam
    val: e={0}
  re_par:
    excludes: *id001
    type: OCamlRunParam
    val: e={0}
  s:
    type: OCamlRunParam
    val: s={0}
  threads:
    type: EnvVar
    val: '{0}'
    var: MMTK_THREADS
  time_stats:
    type: Wrapper
    val: /usr/bin/time -f "%Uuser %Ssystem %eelapsed %PCPU (%Xavgtext+%Davgdata %Mmaxresident)k"
plugins:
  zulip:
    request:
      to:
      - 361443
      type: private
    type: Zulip
remote_host: null
runtimes:
  ocaml-pr14571:
    commit: 16cc07f26ded44a3c2f85ba3c0c9a032e242912f
    repo: https://github.com/NickBarnes/ocaml.git
    type: OCaml
  ocaml-trunk-3b14dfbc:
    commit: 3b14dfbcca7c6c24803fc9bbbc5d4a8cc2e7f75b
    type: OCaml
schema_version: '1.0'
spread_factor: 1
suites:
  macro-alt-ergo-monorepo:
    programs:
      alt_ergo_chain_default:
        args: --input native ${RUNNING_MACRO_BENCH_DIR}/benchmarks/alt-ergo/alt_ergo_chain_default.why
        build_script: alt-ergo.build.sh
        path: ${RUNNING_MACRO_BENCH_DIR}/benchmarks/alt-ergo
      alt_ergo_chain_large:
        args: --input native ${RUNNING_MACRO_BENCH_DIR}/benchmarks/alt-ergo/alt_ergo_chain_large.why
        build_script: alt-ergo.build.sh
        path: ${RUNNING_MACRO_BENCH_DIR}/benchmarks/alt-ergo
      alt_ergo_chain_small:
        args: --input native ${RUNNING_MACRO_BENCH_DIR}/benchmarks/alt-ergo/alt_ergo_chain_small.why
        build_script: alt-ergo.build.sh
        path: ${RUNNING_MACRO_BENCH_DIR}/benchmarks/alt-ergo
      alt_ergo_fill:
        args: --input native ${RUNNING_MACRO_BENCH_DIR}/benchmarks/alt-ergo/fill_x100.why
        build_script: alt-ergo.build.sh
        path: ${RUNNING_MACRO_BENCH_DIR}/benchmarks/alt-ergo
      alt_ergo_unsat_smt2:
        args: --timelimit 15 ${RUNNING_MACRO_BENCH_DIR}/benchmarks/alt-ergo/unsat.smt2
        build_script: alt-ergo.build.sh
        expected_exit: 142
        path: ${RUNNING_MACRO_BENCH_DIR}/benchmarks/alt-ergo
      alt_ergo_yyll:
        args: --input native ${RUNNING_MACRO_BENCH_DIR}/benchmarks/alt-ergo/yyll.why
        build_script: alt-ergo.build.sh
        path: ${RUNNING_MACRO_BENCH_DIR}/benchmarks/alt-ergo
    timeout: 300
    type: OCamlBenchmarkSuite
  macro-coq-monorepo:
    ocamlrunparam: e=25,d=2
    programs:
      coqc_corelib_stress:
        args: ${RUNNING_MACRO_BENCH_DIR}/benchmarks/coq/coq_corelib_stress.v
        build_script: coq.build.sh
        path: ${RUNNING_MACRO_BENCH_DIR}/benchmarks/coq
      coqc_tree_default:
