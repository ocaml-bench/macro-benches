tags:
  all_benches:
    description: 'Everything runnable: every ladder rung AND every legacy bench, across
      all enabled

      suites (the two disabled suites, merlin and lavyek, stay disabled). Use

      RUNNING_TAG=all_benches to run the entire suite at every size at once.

      '
    exercised_by:
      macro-alt-ergo-monorepo:
      - alt_ergo_fill
      - alt_ergo_yyll
      - alt_ergo_chain_small
      - alt_ergo_chain_default
      - alt_ergo_chain_large
      - alt_ergo_unsat_smt2
      macro-coq-monorepo:
      - coqc_corelib_stress
      - coqc_tree_small
      - coqc_tree_default
      - coqc_tree_large
      macro-cpdf-monorepo:
      - cpdf_merge
      - cpdf_blacktext
      - cpdf_scale
      - cpdf_squeeze
      - cpdf_squeeze_small
      - cpdf_squeeze_default
      - cpdf_squeeze_large
      macro-decompress:
      - test_decompress
      - test_decompress_small
      - test_decompress_default
      - test_decompress_large
      macro-devkit:
