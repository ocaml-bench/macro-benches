      - ocamlformat_rocq_large
      macro-owl:
      - owl_gc
      - owl_gc_small
      - owl_gc_default
      - owl_gc_large
      - owl_gc_huge
      macro-pplacer:
      - pplacer_testsuite
      - pplacer_like_small
      - pplacer_like_default
      - pplacer_like_large
      macro-sedlex:
      - sedlex_tokenize
      - sedlex_tokenize_small
      - sedlex_tokenize_default
      - sedlex_tokenize_large
      macro-yojson:
      - ydump_repeat
      - ydump_repeat_small
      - ydump_repeat_default
      - ydump_repeat_large
      macro-zarith:
      - zarith_pi
      - zarith_pi_small
      - zarith_pi_default
      - zarith_pi_large
      - zarith_pi_huge
  atomics:
    cold:
      macro-devkit:
      - devkit_stre
      - devkit_htmlstream
      - devkit_network
      - devkit_gzip
      macro-merlin:
      - merlin_bench
    description: "Atomic.* operations on the hot path \u2014 caml_atomic_*.  Includes\n\
      compare_and_set, fetch_and_add, exchange.  Distinct from `kcas`\n(which is a\
      \ library on top of Atomic).\n"
    exercised_by:
      macro-eio:
      - eio_fiber_stream
      macro-lavyek-monorepo:
      - lavyek_kv_1d
      - lavyek_kv_2d
      - lavyek_kv_4d
      - lavyek_kv_8d
    verified_at:
    - "duniverse/lavyek/src/memtable.ml:25-67 \u2014 Atomic.make, get, compare_and_set,\
      \ incr on bucket arrays"
    - "duniverse/lavyek/src/chunk_file.ml:9-18 \u2014 Atomic.compare_and_set on pending-writes\
      \ tuple"
    - "duniverse/lavyek/src/memfilter.ml:7-15 \u2014 Atomic.compare_and_set on Bloom\
      \ filter bits"
    - "duniverse/eio/lib_eio/sem_state.ml:79-168 \u2014 Atomic.fetch_and_add/exchange/CAS\
      \ for semaphore internals"
    - "benchmarks/lavyek/lavyek_bench.ml \u2014 Atomic.fetch_and_add chunk dispatcher"
  bigarrays:
    description: "Bigarray allocation (caml_ba_alloc) \u2014 bulk off-heap byte data\n\
      with header on the OCaml heap.  A proper subset of\n`custom_block_finalisation`\
      \ (every Bigarray is a custom block\nwith caml_ba_finalize as its `finalize`\
      \ op), but worth its own\ntag because Bigarray-specific regressions hit a narrower\
      \ code\npath.\n"
    exercised_by:
      macro-decompress:
      - test_decompress
      macro-liq-video-frames:
      - liq_video_frames_pool
      macro-ocamlc-self-compile:
      - ocamlc_self_compile
      macro-owl:
      - owl_gc
    verified_at:
    - "compiler-libs bytecomp/emitcode.ml:53 \u2014 `Bigarray.Array1.create Bigarray.Char\
      \ Bigarray.c_layout` for the emit buffer"
    - "benchmarks/owl/owl_gc.ml:79 \u2014 Bigarray.Array2.create Bigarray.Float64"
    - "benchmarks/liq-video-frames/liq_video_frames.ml:102-104 \u2014 Bigarray.Array1.create\
      \ Bigarray.Char per frame"
  custom_block_finalisation:
    description: "caml_alloc_custom / caml_alloc_custom_mem allocation plus the\n\
      finalize callback registered in the custom_operations struct.\nIncludes Bigarrays\
      \ (via caml_ba_finalize), Zarith Z.t (GMP-aware\nfinaliser), zlib z_stream blocks,\
      \ sqlite3 statement handles, GSL\nworkspaces (via Gc.finalise).  Distinct from\
      \ `bigarrays` (a\nproper subset \u2014 Bigarray IS one kind of custom block).\n"
    exercised_by:
      macro-decompress:
      - test_decompress
      macro-devkit:
      - devkit_gzip
      macro-liq-video-frames:
      - liq_video_frames_pool
      macro-owl:
      - owl_gc
      macro-pplacer:
      - pplacer_testsuite
      macro-zarith:
      - zarith_pi
    verified_at:
    - "duniverse/Zarith/caml_z.c:323-324 \u2014 caml_alloc_custom + ml_z_custom_ops"
    - "benchmarks/liq-video-frames/pool_stubs.c:34 \u2014 caml_alloc_custom_mem"
    - "duniverse/gsl-ocaml/src/{vector,sum,eigen,odeiv,integration}.ml \u2014 Gc.finalise\
      \ _free"
    - "compiler-libs runtime/bigarray.c \u2014 caml_ba_alloc registers caml_ba_finalize"
  default_run:
    description: "Input-size ladder \u2014 the DEFAULT rung of every tool. This is\
      \ the tag a bare run\n(no RUNNING_TAG) falls back to, so `default_run` is the\
      \ standard suite.\n"
    exercised_by:
      macro-alt-ergo-monorepo:
      - alt_ergo_chain_default
      macro-coq-monorepo:
      - coqc_tree_default
      macro-cpdf-monorepo:
      - cpdf_squeeze_default
      macro-decompress:
      - test_decompress_default
      macro-devkit:
      - devkit_htmlstream_default
      macro-eio:
      - eio_conc_default
      macro-frama-c-monorepo:
      - frama_c_eva_sqlite_default
      macro-goblint-monorepo:
      - goblint_gen_default
      macro-irmin:
      - irmin_mem_rw_default
      macro-jsoo:
      - jsoo_default
      macro-liq-video-frames:
      - liq_video_frames_pool_default
      macro-liquidsoap-lang:
      - liq_parse_typecheck_default
      macro-menhir-monorepo:
      - menhir_ocamly
      macro-ocamlc-self-compile:
      - ocamlc_compile_uucp_default
      macro-ocamlformat:
      - ocamlformat_rocq_default
      macro-owl:
      - owl_gc_default
      macro-pplacer:
      - pplacer_like_default
      macro-sedlex:
      - sedlex_tokenize_default
      macro-yojson:
      - ydump_repeat_default
      macro-zarith:
      - zarith_pi_default
  domains:
    cold:
      macro-lavyek-monorepo:
      - lavyek_kv_1d
      macro-merlin:
      - merlin_bench
    description: "Domain.spawn / Domain.join \u2014 real OCaml domain creation\n(multi-OS-threaded).\
      \  Distinct from `effects` (which Eio uses\nsingle-domain too) and from `atomics`\
      \ (which doesn't require\nmultiple domains).\n"
    exercised_by:
      macro-lavyek-monorepo:
      - lavyek_kv_2d
      - lavyek_kv_4d
      - lavyek_kv_8d
    verified_at:
    - "benchmarks/lavyek/lavyek_bench.ml:123 \u2014 `if id_domain = 0 then fn () else\
      \ Domain_manager.run dmgr fn`"
    - "benchmarks/merlin/merlin_bench.ml:113 \u2014 Domain.spawn @@ Mpipeline.domain_typer\
      \ shared"
  effects:
    cold:
      macro-merlin:
      - merlin_bench
    description: "Effect.perform \u2014 OCaml 5 effects.  Includes Eio's use of effects\n\
      under the hood (every Fiber.fork_promise / Stream op / yield\nflows through\
      \ Effect.perform + deep try_with).\n"
    exercised_by:
      macro-eio:
      - eio_fiber_stream
      macro-lavyek-monorepo:
      - lavyek_kv_1d
      - lavyek_kv_2d
      - lavyek_kv_4d
      - lavyek_kv_8d
    verified_at:
    - "duniverse/eio/lib_eio/core/suspend.ml:6 \u2014 Effect.perform (Suspend fn)"
    - "duniverse/eio/lib_eio/core/fiber.ml:11 \u2014 Effect.perform (Fork (...))"
    - "duniverse/eio/lib_eio/core/cancel.ml:123 \u2014 Effect.perform Get_context"
  eio_fibers:
    description: "Eio.Fiber.* / Eio.Stream / Eio.Switch \u2014 Eio's fiber-API surface.\n\
      Subset of `effects` (every Eio call performs effects under the\nhood), but a\
      \ narrower tag for Eio-specific regressions.\n"
    exercised_by:
      macro-eio:
      - eio_fiber_stream
      macro-lavyek-monorepo:
      - lavyek_kv_1d
      - lavyek_kv_2d
      - lavyek_kv_4d
      - lavyek_kv_8d
    verified_at:
    - "benchmarks/eio/eio_bench.ml \u2014 Eio.Stream.add/take, Eio.Fiber.both/all,\
      \ Eio_main.run"
    - "benchmarks/lavyek/lavyek_bench.ml \u2014 Fiber.fork_promise, Fiber.all, Fiber.yield\
      \ via Eio"
  ephemerons:
    cold:
      macro-merlin:
      - merlin_bench
    description: "Ephemeron.K1 / K2 / Kn \u2014 used by hash-consing libraries and\n\
      type-checker caches.  Runtime: caml_ephe_*.\n"
    exercised_by: {}
    gap: 'No benchmark exercises ephemerons on the hot path.  The OCaml

      compiler-libs at 5.4.1 and trunk use Hashtbl.Make in typing/btype.ml.

      Merlin''s saved_parts.ml is cold and merlin_bench is also currently

      disabled.  Coq''s CEphemeron is reached only by the VM backend, not

      the kernel reduction workload.  Closing this gap requires either

      re-enabling merlin_bench *and* finding a heavier ephemeron user

      (Saved_parts is small) or porting a sandmark ephemeron microbench.

      '
    verified_at:
    - "duniverse/merlin/src/ocaml/typing/saved_parts.ml:3 \u2014 Ephemeron.K1 stash\
      \ for parse-tree fragments (touched at parse time only)"
    - "compiler-libs typing/btype.ml:46 \u2014 uses Hashtbl.Make, NOT Ephemeron (verified\
      \ in 5.4.1 and trunk)"
    - "duniverse/rocq/clib/cEphemeron.ml \u2014 used by Coq VM backend, but coq_corelib_stress.v\
      \ is kernel-only and does not reach the VM"
  ffi_bulk:
    cold:
      macro-decompress:
      - test_decompress
    description: "Bulk FFI stub calls in inner loops \u2014 OpenBLAS, GMP, GSL, sqlite3,\n\
      zlib via C bindings.  Sensitive to per-call stub overhead\n(caml_enter_blocking_section\
      \ / caml_leave_blocking_section\nround-trips, argument marshaling).\n"
    exercised_by:
      macro-devkit:
      - devkit_gzip
      macro-owl:
      - owl_gc
      macro-pplacer:
      - pplacer_testsuite
      macro-zarith:
      - zarith_pi
    verified_at:
    - "benchmarks/owl/owl_gc.ml:13 \u2014 Mat.dot dispatches to OpenBLAS GEMM"
    - "duniverse/Zarith/caml_z.c \u2014 every Z.{add,mul,div} is a GMP stub"
    - duniverse/gsl-ocaml/src/*.ml + duniverse/sqlite3-ocaml/lib/sqlite3_stubs.c
  huge_run:
    description: "Input-size ladder \u2014 the HUGE rung (only the tools that have\
      \ one). Very heavy;\nrun explicitly.\n"
    exercised_by:
      macro-owl:
      - owl_gc_huge
      macro-zarith:
      - zarith_pi_huge
  io_uring:
    cold:
      macro-eio:
      - eio_fiber_stream
    description: "Real io_uring async I/O via eio_linux's Uring.t.  Per-domain\nkernel-side\
      \ rings (iou-wrk-* helper threads), sqe submission,\ncqe polling.  Note: eio_fiber_stream\
      \ uses Eio but its workload\nis in-memory only \u2014 it never hits the ring.\n"
    exercised_by:
      macro-lavyek-monorepo:
      - lavyek_kv_1d
      - lavyek_kv_2d
      - lavyek_kv_4d
      - lavyek_kv_8d
    verified_at:
    - "duniverse/eio/lib_eio_linux/sched.ml:50,115-117,189-190 \u2014 Uring.t integration"
    - "benchmarks/lavyek/lavyek_bench.ml \u2014 per-domain WAL writes go through io_uring"
  kcas:
    description: 'Lock-free multi-CAS via the kcas library.  Runtime: contention on

      caml_atomic_* under MCAS retry loops.

      '
    exercised_by: {}
    gap: 'Lavyek''s dune-project lists kcas/kcas_data as deps, but the actual

      in-memory index, compaction queue, and Bloom filter are hand-rolled

      Atomic.compare_and_set loops (memtable.ml, chunk_file.ml,

      memfilter.ml, compact.ml).  kcas itself is never invoked from any

      benchmark in the suite.  A standalone benchmark wrapping kcas

      directly (e.g. a kcas_data.Hashtbl workload) would close this.

      '
    verified_at:
    - "duniverse/lavyek/dune-project \u2014 lists kcas + kcas_data as deps"
    - "grep -rn 'Kcas\\.\\|Kcas_data\\.\\|Loc\\.' duniverse/lavyek/src/ \u2014 returns\
      \ nothing"
    - "duniverse/lavyek/REMOVED.md:22 \u2014 module Queue = Kcas_data.Queue removed\
      \ as vestige"
  large_run:
    description: "Input-size ladder \u2014 the LARGE rung of every tool (heaviest\
