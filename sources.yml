# =============================================================================
# Git sources, pinned by commit
# =============================================================================
# Cloned by clone_pinned() (scripts/lib-sources.sh), which fetches the commit
# directly and keeps .git so `git -C <dir> rev-parse HEAD` tells you what you
# have. `branch` is where the commit came from — provenance only; it is not used
# to fetch, so a branch that moves or disappears upstream cannot change what a
# cold setup vendors.

# --- replacements for lockfile packages (see CLAUDE.md patches 4 + 5) ---
ppxlib:
  repo: "https://github.com/ocaml-ppx/ppxlib.git"
  branch: "main"
  commit: "df9d10b5163b35d646b75dc412237280e43273d0"
  date: "2026-06-01"
  notes: "Replaces the lockfile's ppxlib; adds Ast_506 for OCaml 5.6 trunk. Drop once a release supports 5.6."

lwt:
  repo: "https://github.com/ocsigen/lwt.git"
  branch: "master"
  commit: "167a6ea45363647be9cc58dde9155d9e2f176e69"
  date: "2026-04-20"
  notes: "Replaces the lockfile's lwt; fixes socketaddr.h for OCaml 5.6. Drop once a release supports 5.6."

# --- vendored tools not in the lockfile ---
js_of_ocaml:
  repo: "https://github.com/ocsigen/js_of_ocaml.git"
  branch: "master"
  commit: "8b46f0628091b73513141a010c3ac3914a872395"
  date: "2026-07-28"
  notes: >
    Released jsoo rejects OCaml >= 5.5 outright. Support landed on master (the
    `[ 5; 7 ]` bound in compiler/lib/magic_number.ml), so master is the pin. This
    used to track the `ocaml-5.6` PR branch, which upstream squashed and deleted —
    the old commit is no longer reachable, so a cold clone of that branch fails.
    Note ocamlc-self-compile also takes its workload from this tree
    (benchmarks/sources/ml), so bumping this changes two benchmarks.

merlin:
  repo: "https://github.com/ocaml/merlin.git"
  branch: "merlin-domains"
  commit: "7f033f9352531e0179f5d3a1f0000bb1be740844"
  date: "2025-10-03"
  notes: "PR #1890 domains branch; benchmark is DISABLED (upstream race, see benchmarks/merlin/UPSTREAM_BUG.md). Vendored but not built."

pplacer:
  repo: "https://github.com/matsen/pplacer.git"
  branch: "master"
  commit: "40509ec8017d6d899bdbc3659260ae32e5be5953"
  date: "2026-01-28"
  notes: "Not in opam. Needs libgsl-dev + libsqlite3-dev. Patched by setup-monorepo.sh (patch 13)."

mcl:
  repo: "https://github.com/fhcrc/mcl.git"
  branch: "master"
  commit: "1f1932b64619e9bd9ecbcb421cb1e3f1eb535e80"
  date: "2025-12-01"
  notes: "pplacer's git submodule (SSH URL upstream, so cloned over HTTPS separately). Built in place by configure/make. Patched by setup-monorepo.sh (patch 12)."

# --- apron chain for goblint (non-dune: configure/make + camlidl) ---
# Built per-runtime into a self-contained prefix by scripts/vendor-apron.sh.
# The `branch` field here names the release tag the commit was resolved from.
# Pinning the commit rather than the tag means a re-pointed tag upstream cannot
# change what we build.
