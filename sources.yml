# Pinned source versions for vendored packages.
#
# This file is the single source of truth: the vendor scripts and
# setup-monorepo.sh read it through scripts/lib-sources.sh (`src_field`,
# `clone_pinned`) rather than carrying their own copies of a version. Change a
# version or a commit here, re-run `make setup`, and that is the whole bump.
#
# Everything here is pinned by construction — tarballs by version + md5, git
# sources by commit. Nothing tracks a branch HEAD. Six git sources used to
# (ppxlib, lwt, merlin, js_of_ocaml, pplacer, mcl), which meant a cold setup
# vendored whatever upstream had that morning; by the time they were pinned two
# had already drifted away from the validated tree and one branch had been
# deleted upstream, breaking a cold setup outright.

